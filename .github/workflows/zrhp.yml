name: ZRHP

# CI of the ZRHP adapter in this fork (src/adapter/zrhp): lint, build, the full test suite with the shared vectors and the
# Rust NCP simulator of zigbee-rs, and an end-to-end Zigbee2MQTT run on the simulator (bare metal and Docker image).

on:
    push:
        branches: [zrhp, "zrhp-*"]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

env:
    ZIGBEE_RS_REPO: https://github.com/faronov/zigbee-rs.git
    # the simulator (examples/ncp_sim.rs) and the shared vectors come from zigbee-rs master
    ZIGBEE_RS_REFS: "master"
    RUST_TOOLCHAIN: nightly-2026-03-23
    Z2M_REF: 2.14.3

jobs:
    ncp-sim:
        name: Build the Rust NCP simulator
        runs-on: ubuntu-latest
        steps:
            - name: Check out zigbee-rs with examples/ncp_sim.rs
              run: |
                  git clone --quiet "$ZIGBEE_RS_REPO" zigbee-rs
                  for ref in $ZIGBEE_RS_REFS; do
                      git -C zigbee-rs checkout --quiet "origin/$ref" 2>/dev/null || continue
                      if [ -f zigbee-rs/apps/ncp-coordinator/examples/ncp_sim.rs ]; then echo "zigbee-rs $ref $(git -C zigbee-rs rev-parse --short HEAD)"; break; fi
                  done
                  test -f zigbee-rs/apps/ncp-coordinator/examples/ncp_sim.rs
            - uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: ${{ env.RUST_TOOLCHAIN }}
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: zigbee-rs/apps/ncp-coordinator
            - run: cargo build --manifest-path zigbee-rs/apps/ncp-coordinator/Cargo.toml --example ncp_sim --locked
            - name: Collect the simulator and the shared vectors
              run: |
                  mkdir -p out/vectors
                  cp zigbee-rs/apps/ncp-coordinator/target/debug/examples/ncp_sim out/
                  cp zigbee-rs/docs/book/src/advanced/host-protocol-vectors/*.json out/vectors/
            - uses: actions/upload-artifact@v4
              with:
                  name: ncp-sim
                  path: out/

    test:
        name: Check, build, test (with the Rust NCP)
        needs: ncp-sim
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/download-artifact@v4
              with:
                  name: ncp-sim
                  path: ${{ runner.temp }}/ncp-sim
            - run: chmod +x "$RUNNER_TEMP/ncp-sim/ncp_sim"
            - name: Shared vectors are byte-identical to zigbee-rs
              run: diff -r "$RUNNER_TEMP/ncp-sim/vectors" test/adapter/zrhp/vectors
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm i --frozen-lockfile
            - run: pnpm run check
            - run: pnpm run build
            - name: Test (coverage; the Rust simulator tests must run)
              env:
                  ZRHP_NCP_SIM: ${{ runner.temp }}/ncp-sim/ncp_sim
                  ZRHP_REQUIRE_SIM: "1"
              run: pnpm run test:coverage -- --testTimeout=10000
            - name: ZRHP adapter coverage (src/adapter/zrhp)
              env:
                  ZRHP_NCP_SIM: ${{ runner.temp }}/ncp-sim/ncp_sim
                  ZRHP_REQUIRE_SIM: "1"
              run: >
                  pnpm exec vitest run --config ./test/vitest.config.mts test/adapter/zrhp --testTimeout=10000 --coverage
                  --coverage.include='src/adapter/zrhp/**' --coverage.exclude=nothing --coverage.thresholds.100=false
                  --coverage.thresholds.lines=88 --coverage.thresholds.statements=88 --coverage.thresholds.functions=88
                  --coverage.thresholds.branches=80

    z2m-e2e:
        name: Zigbee2MQTT on the Rust NCP (bare metal + Docker)
        needs: [ncp-sim, test]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/download-artifact@v4
              with:
                  name: ncp-sim
                  path: ${{ runner.temp }}/ncp-sim
            - run: chmod +x "$RUNNER_TEMP/ncp-sim/ncp_sim"
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
            - run: corepack enable
            - run: sudo apt-get update -qq && sudo apt-get install -y -qq socat mosquitto mosquitto-clients && sudo systemctl start mosquitto
            - name: Build Zigbee2MQTT with this herdsman commit (scripts/zrhp/build-z2m.sh)
              run: HERDSMAN_DIR="$PWD" Z2M_REF="$Z2M_REF" bash scripts/zrhp/build-z2m.sh "$RUNNER_TEMP/z2m"
            - name: End to end (bare metal)
              run: bash scripts/zrhp/e2e-z2m-sim.sh "dir:$RUNNER_TEMP/z2m" "$RUNNER_TEMP/ncp-sim/ncp_sim"
            - name: Build the Docker image (docker/zrhp-z2m/Dockerfile)
              run: docker build -t zigbee2mqtt-zrhp --build-arg "HERDSMAN_REF=${{ github.sha }}" --build-arg "Z2M_REF=$Z2M_REF" -f docker/zrhp-z2m/Dockerfile .
            - name: End to end (Docker image)
              run: bash scripts/zrhp/e2e-z2m-sim.sh docker:zigbee2mqtt-zrhp "$RUNNER_TEMP/ncp-sim/ncp_sim"

    package:
        # A built npm tarball of every green push to `zrhp`, as a GitHub release asset (immutable, so lockfiles of
        # faronov/zigbee2mqtt branch `zrhp` can pin it): v<version>-zrhp.<run number>.
        name: Package (release asset for the Zigbee2MQTT fork)
        needs: [test, z2m-e2e]
        if: github.event_name == 'push' && github.ref == 'refs/heads/zrhp'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm i --frozen-lockfile
            - name: Version and pack
              id: pack
              run: |
                  base="$(node -p 'require("./package.json").version')"
                  version="${base}-zrhp.${GITHUB_RUN_NUMBER}"
                  npm version --no-git-tag-version --allow-same-version "$version" >/dev/null
                  pnpm pack --pack-destination "$RUNNER_TEMP"
                  echo "version=$version" >>"$GITHUB_OUTPUT"
                  echo "tgz=$RUNNER_TEMP/zigbee-herdsman-$version.tgz" >>"$GITHUB_OUTPUT"
            - name: Check the tarball
              run: |
                  tar -tzf "${{ steps.pack.outputs.tgz }}" | grep -q 'package/dist/adapter/zrhp/adapter/zrhpAdapter.js'
                  sha256sum "${{ steps.pack.outputs.tgz }}"
            - name: Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ steps.pack.outputs.version }}
                  TGZ: ${{ steps.pack.outputs.tgz }}
              run: |
                  gh release create "v$VERSION" "$TGZ" --target "$GITHUB_SHA" --prerelease \
                      --title "zigbee-herdsman $VERSION (ZRHP)" \
                      --notes "Built from ${GITHUB_SHA} (branch zrhp). Install: \`pnpm add https://github.com/${GITHUB_REPOSITORY}/releases/download/v$VERSION/$(basename "$TGZ")\`; used by faronov/zigbee2mqtt branch zrhp."
